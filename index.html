<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>ورود | کاتالوگ قیمت پمپ‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1e293b;
    --primary-2:#334155;
    --accent:#059669;
    --accent-2:#10b981;
    --bg:#F8FAFC;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --danger:#dc2626;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Vazirmatn', Tahoma, sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(16,185,129,.25), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(59,130,246,.20), transparent 45%),
      linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #334155 100%);
    padding:20px;
  }
  /* decorative industrial line-art (gear-ish rings + pipe lines) */
  .deco{
    position:absolute;
    inset:0;
    z-index:0;
    opacity:.18;
    pointer-events:none;
  }
  .deco svg{width:100%;height:100%;}

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
  }
  .card{
    background:rgba(255,255,255,0.98);
    border-radius:20px;
    padding:34px 28px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    text-align:center;
    animation:rise .5s ease;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }
  .badge{
    width:64px;height:64px;
    margin:0 auto 14px;
    border-radius:16px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    display:flex;align-items:center;justify-content:center;
  }
  .badge svg{width:34px;height:34px;stroke:#fff;}
  h1{
    font-size:1.3rem;
    margin:0 0 4px;
    color:var(--text);
  }
  .sub{
    font-size:.85rem;
    color:var(--muted);
    margin:0 0 22px;
  }
  .field{
    position:relative;
    margin-bottom:14px;
  }
  input[type="password"], input[type="text"]{
    width:100%;
    padding:14px 46px 14px 44px;
    border-radius:12px;
    border:1.5px solid var(--border);
    font-size:1.05rem;
    font-family:inherit;
    text-align:center;
    letter-spacing:2px;
    transition:border-color .15s ease, box-shadow .15s ease;
    outline:none;
  }
  input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(5,150,105,.12);
  }
  .toggle-eye{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
    color:var(--muted);
    display:flex;
    min-width:44px;
    min-height:44px;
    align-items:center;
    justify-content:center;
  }
  .toggle-eye svg{width:20px;height:20px;}
  button.submit{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;
    font-size:1.05rem;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
    min-height:48px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button.submit:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 22px rgba(5,150,105,.35);
  }
  button.submit:active{transform:translateY(0);}
  .error{
    color:var(--danger);
    font-size:.85rem;
    margin:10px 0 0;
    min-height:18px;
  }
  .shake{animation:shake .4s;}
  @keyframes shake{
    10%,90%{transform:translateX(-1px);}
    20%,80%{transform:translateX(2px);}
    30%,50%,70%{transform:translateX(-4px);}
    40%,60%{transform:translateX(4px);}
  }
  .hint{
    margin-top:16px;
    font-size:.78rem;
    color:var(--muted);
    background:var(--bg);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:8px 10px;
    line-height:1.7;
  }
  .credit{
    position:relative;
    z-index:1;
    text-align:center;
    color:rgba(255,255,255,.65);
    font-size:.75rem;
    margin-top:18px;
  }
</style>
</head>
<body>

<div class="deco" aria-hidden="true">
  <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <circle cx="120" cy="140" r="90" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="120" cy="140" r="60" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="680" cy="660" r="120" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="680" cy="660" r="80" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M0 400 H250 V300 H500 V400 H800" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M0 500 H150 V620 H450 V500 H800" fill="none" stroke="#fff" stroke-width="2"/>
  </svg>
</div>

<div class="wrap">
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 8v4l3 2"/>
      </svg>
    </div>
    <h1>سیال قطعه‌ساز</h1>
    <p class="sub">ورود به کاتالوگ قیمت پمپ‌ها</p>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <input type="password" id="pass" placeholder="رمز عبور" inputmode="numeric" autocomplete="off" required>
        <button type="button" class="toggle-eye" id="eyeBtn" aria-label="نمایش رمز عبور">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button type="submit" class="submit">ورود</button>
      <p class="error" id="errMsg"></p>
    </form>

    <div class="hint">رمز ورود مهمان / همکار: <strong>123</strong></div>
  </div>
  <div class="credit">طراحی و توسعه: سعید مرجانی</div>
</div>

<script>
  const ADMIN_PASS = "1352";
  const GUEST_PASS = "123";

  const form = document.getElementById('loginForm');
  const passInput = document.getElementById('pass');
  const errMsg = document.getElementById('errMsg');
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  const card = document.querySelector('.card');

  eyeBtn.addEventListener('click', () => {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    eyeIcon.innerHTML = isPass
      ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
  });

  // already logged in on this device? skip straight to the store
  if (localStorage.getItem('role')) {
    window.location.replace('store.html');
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const val = passInput.value.trim();
    if (val === ADMIN_PASS){
      localStorage.setItem('role','admin');
      window.location.href = 'store.html';
    } else if (val === GUEST_PASS){
      localStorage.setItem('role','guest');
      window.location.href = 'store.html';
    } else {
      errMsg.textContent = 'رمز عبور اشتباه است.';
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      passInput.focus();
      passInput.select();
    }
  });
</script>

</body>
</html>
