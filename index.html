<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لیست قیمت پمپ‌ها</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --text:#1c2230;
    --muted:#6b7280;
    --brand:#1d4ed8;
    --brand-dark:#1e3a8a;
    --border:#e5e7eb;
    --price-bg:#eef4ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    color:#fff;
    padding:28px 20px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.6rem;
  }
  header p{
    margin:0;
    opacity:.9;
    font-size:.95rem;
  }
  .container{
    max-width:1100px;
    margin:0 auto;
    padding:20px;
  }
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  #search{
    flex:1;
    min-width:200px;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    font-size:1rem;
    font-family:inherit;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px;
  }
  .card{
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--border);
    display:flex;
    flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.06);
  }
  .card img{
    width:100%;
    height:180px;
    object-fit:cover;
    background:#eee;
  }
  .card-body{
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
  }
  .card h3{
    margin:0;
    font-size:1.05rem;
  }
  .specs{
    margin:0;
    padding:0;
    list-style:none;
    color:var(--muted);
    font-size:.85rem;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .specs li:before{
    content:"• ";
    color:var(--brand);
  }
  .price-row{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--price-bg);
    border-radius:10px;
    padding:10px 12px;
  }
  .price{
    font-weight:bold;
    font-size:1.1rem;
    color:var(--brand-dark);
  }
  .updated{
    font-size:.72rem;
    color:var(--muted);
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.8rem;
    padding:24px 10px 40px;
  }
  .empty, .error{
    text-align:center;
    color:var(--muted);
    padding:40px 10px;
  }
</style>
</head>
<body>

<header>
  <h1>لیست قیمت پمپ‌ها</h1>
  <p id="subtitle">قیمت‌ها به‌صورت هفتگی/ماهانه بر اساس نوسانات بازار به‌روزرسانی می‌شود</p>
</header>

<div class="container">
  <div class="toolbar">
    <input type="text" id="search" placeholder="جستجوی نام پمپ...">
  </div>
  <div id="grid" class="grid"></div>
</div>

<footer>این صفحه فقط جهت اطلاع‌رسانی قیمت است.</footer>

<script>
  let allPumps = [];

  function formatPrice(n){
    return n.toLocaleString('en-US') + " تومان";
  }

  function render(list){
    const grid = document.getElementById('grid');
    grid.innerHTML = "";
    if(list.length === 0){
      grid.innerHTML = '<div class="empty">پمپی پیدا نشد.</div>';
      return;
    }
    list.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      const specsHtml = (p.specs || []).map(s => `<li>${s}</li>`).join('');
      card.innerHTML = `
        <img src="${p.image}" alt="${p.name}" onerror="this.src='https://placehold.co/400x300?text=%D8%B9%DA%A9%D8%B3+%D9%86%D8%AF%D8%A7%D8%B1%D8%AF'">
        <div class="card-body">
          <h3>${p.name}</h3>
          <ul class="specs">${specsHtml}</ul>
          <div class="price-row">
            <div>
              <div class="price">${formatPrice(p.price)}</div>
              <div class="updated">آخرین بروزرسانی: ${p.updated || '-'}</div>
            </div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function loadData(){
    fetch('data.json?_=' + Date.now())
      .then(r => {
        if(!r.ok) throw new Error('not found');
        return r.json();
      })
      .then(data => {
        allPumps = data;
        render(allPumps);
      })
      .catch(err => {
        document.getElementById('grid').innerHTML =
          '<div class="error">خطا در بارگذاری اطلاعات قیمت. لطفاً بعداً دوباره تلاش کنید.</div>';
      });
  }

  document.getElementById('search').addEventListener('input', function(e){
    const q = e.target.value.trim().toLowerCase();
    const filtered = allPumps.filter(p => p.name.toLowerCase().includes(q));
    render(filtered);
  });

  loadData();
</script>

</body>
</html>
